<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScanCount</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #f5c518;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --success: #4caf50;
    --error: #f44336;
    --worker: https://scancount-barcode.scancount-service.workers.dev;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .session-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  .session-info span {
    color: var(--accent);
    font-weight: 600;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* PANELS */
  .panel { display: none; flex: 1; flex-direction: column; }
  .panel.active { display: flex; }

  /* SCAN PANEL */
  .scan-area {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .barcode-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .barcode-input:focus {
    border-color: var(--accent);
  }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { opacity: 0.7; }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  /* RESULT CARD */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: none;
    animation: slideIn 0.15s ease;
  }

  .result-card.visible { display: block; }
  .result-card.found { border-color: var(--success); }
  .result-card.notfound { border-color: var(--error); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .result-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .result-meta .ean { color: var(--accent); }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .qty-label {
    font-size: 13px;
    color: var(--muted);
    flex: 1;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .qty-btn {
    background: var(--surface);
    border: none;
    color: var(--text);
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .qty-btn:active { background: var(--border); }

  .qty-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    width: 50px;
    text-align: center;
    color: var(--accent);
    background: var(--bg);
    height: 40px;
    line-height: 40px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .add-btn {
    width: 100%;
    padding: 11px;
    margin-top: 12px;
    background: var(--success);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .add-btn:active { opacity: 0.7; }

  /* LOADING */
  .loading {
    display: none;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .loading.visible { display: block; }

  /* ITEMS LIST PANEL */
  .list-panel {
    flex: 1;
    overflow-y: auto;
  }

  .list-header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    position: sticky;
    top: 0;
  }

  .total-badge {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
  }

  .item-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    animation: slideIn 0.15s ease;
  }

  .item-row:active { background: var(--surface); }

  .item-info { flex: 1; min-width: 0; }

  .item-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-ean {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .item-qty-controls {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .iq-btn {
    background: var(--surface);
    border: none;
    color: var(--text);
    width: 32px;
    height: 32px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .iq-btn:active { background: var(--border); }

  .iq-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    width: 42px;
    text-align: center;
    color: var(--accent);
    background: var(--bg);
    height: 32px;
    line-height: 32px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--error);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.5;
  }

  /* EXPORT PANEL */
  .export-panel {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .export-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }

  .summary-row:last-child { border-bottom: none; }
  .summary-row .val {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--accent);
  }

  .preview-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    max-height: 160px;
    overflow-y: auto;
    white-space: pre;
    line-height: 1.6;
  }

  textarea.export-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    min-height: 140px;
    width: 100%;
    outline: none;
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .btn-row .btn { flex: 1; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 24px;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--error); }
</style>
</head>
<body>

<header>
  <div class="logo">ScanCount</div>
  <div class="session-info">
    Позицій: <span id="hdrPositions">0</span><br>
    Всього: <span id="hdrTotal">0</span> шт
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">📷 Скан</div>
  <div class="tab" onclick="switchTab('list')">📋 Список</div>
  <div class="tab" onclick="switchTab('export')">📤 Експорт</div>
</div>

<!-- SCAN PANEL -->
<div class="panel active" id="panelScan">
  <div class="scan-area">
    <div class="input-row">
      <input type="text" class="barcode-input" id="barcodeInput"
        placeholder="Штрих-код..."
        inputmode="numeric"
        autocomplete="off"
        autofocus
        onkeydown="if(event.key==='Enter') lookupBarcode()">
      <button class="btn" onclick="lookupBarcode()">→</button>
    </div>

    <div class="loading" id="loading">Шукаю...</div>

    <div class="result-card" id="resultCard">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-meta">
        <span class="ean" id="resultEAN"></span>
        <span id="resultUnit"></span>
      </div>
      <div class="qty-row">
        <span class="qty-label">Кількість:</span>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <div class="qty-val" id="qtyVal">1</div>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <button class="add-btn" onclick="addToList()">✓ Додати до списку</button>
    </div>
  </div>
</div>

<!-- LIST PANEL -->
<div class="panel" id="panelList">
  <div class="list-header">
    <span id="listCount">0 позицій</span>
    <span class="total-badge" id="listTotal">0 шт</span>
  </div>
  <div class="list-panel" id="listItems">
    <div class="empty-state">
      <span class="icon">📦</span>
      <p>Список порожній.<br>Скануйте товари у вкладці «Скан»</p>
    </div>
  </div>
</div>

<!-- EXPORT PANEL -->
<div class="panel" id="panelExport">
  <div class="export-panel">
    <div class="export-title">Підсумок сесії</div>

    <div class="summary-box">
      <div class="summary-row">
        <span>Позицій</span>
        <span class="val" id="expPositions">0</span>
      </div>
      <div class="summary-row">
        <span>Всього одиниць</span>
        <span class="val" id="expTotal">0</span>
      </div>
      <div class="summary-row">
        <span>Дата</span>
        <span class="val" id="expDate">—</span>
      </div>
    </div>

    <div class="preview-box" id="csvPreview">Список порожній</div>

    <textarea class="export-area" id="exportArea" placeholder="CSV тут..."></textarea>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="generateCSV()">Оновити CSV</button>
      <button class="btn" onclick="copyCSV()">Копіювати</button>
    </div>

    <button class="btn btn-danger" onclick="clearAll()" style="margin-top:4px">🗑 Очистити список</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = 'https://scancount-barcode.scancount-service.workers.dev';

let items = JSON.parse(localStorage.getItem('scancount_items') || '[]');
let currentProduct = null;
let currentQty = 1;

function saveItems() {
  localStorage.setItem('scancount_items', JSON.stringify(items));
  updateHeader();
}

function updateHeader() {
  const positions = items.length;
  const total = items.reduce((s, i) => s + i.qty, 0);
  document.getElementById('hdrPositions').textContent = positions;
  document.getElementById('hdrTotal').textContent = total;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['scan','list','export'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach((p, i) => {
    p.classList.toggle('active', ['panelScan','panelList','panelExport'][i] === 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1));
  });
  if (tab === 'list') renderList();
  if (tab === 'export') renderExport();
}

async function lookupBarcode() {
  const input = document.getElementById('barcodeInput');
  const ean = input.value.trim().replace(/\D/g, '');
  if (!ean) return;

  showResult(false);
  document.getElementById('loading').classList.add('visible');

  try {
    const res = await fetch(`${WORKER_URL}/${ean}`);
    const data = await res.json();
    document.getElementById('loading').classList.remove('visible');

    if (data.found) {
      currentProduct = { ean, title: data.title, unit: data.unit };
      currentQty = 1;
      document.getElementById('qtyVal').textContent = '1';
      document.getElementById('resultTitle').textContent = data.title;
      document.getElementById('resultEAN').textContent = ean;
      document.getElementById('resultUnit').textContent = data.unit || '';
      const card = document.getElementById('resultCard');
      card.className = 'result-card visible found';
    } else {
      currentProduct = { ean, title: 'Невідомий товар', unit: 'шт' };
      currentQty = 1;
      document.getElementById('qtyVal').textContent = '1';
      document.getElementById('resultTitle').textContent = '⚠ Не знайдено в базі';
      document.getElementById('resultEAN').textContent = ean;
      document.getElementById('resultUnit').textContent = '';
      const card = document.getElementById('resultCard');
      card.className = 'result-card visible notfound';
    }
  } catch (e) {
    document.getElementById('loading').classList.remove('visible');
    toast('Помилка зв\'язку з сервером', true);
  }
}

function showResult(visible) {
  const card = document.getElementById('resultCard');
  if (!visible) card.className = 'result-card';
}

function changeQty(delta) {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyVal').textContent = currentQty;
}

function addToList() {
  if (!currentProduct) return;
  const existing = items.find(i => i.ean === currentProduct.ean);
  if (existing) {
    existing.qty += currentQty;
    toast(`+${currentQty} до "${existing.title.slice(0,20)}..."`);
  } else {
    items.unshift({ ...currentProduct, qty: currentQty });
    toast(`Додано: ${currentProduct.title.slice(0, 28)}...`);
  }
  saveItems();
  showResult(false);
  document.getElementById('barcodeInput').value = '';
  document.getElementById('barcodeInput').focus();
}

function renderList() {
  const container = document.getElementById('listItems');
  document.getElementById('listCount').textContent = items.length + ' позицій';
  const total = items.reduce((s, i) => s + i.qty, 0);
  document.getElementById('listTotal').textContent = total + ' шт';

  if (items.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="icon">📦</span><p>Список порожній.<br>Скануйте товари у вкладці «Скан»</p></div>`;
    return;
  }

  container.innerHTML = items.map((item, idx) => `
    <div class="item-row">
      <div class="item-info">
        <div class="item-name">${item.title}</div>
        <div class="item-ean">${item.ean} · ${item.unit || 'шт'}</div>
      </div>
      <div class="item-qty-controls">
        <button class="iq-btn" onclick="adjustItem(${idx}, -1)">−</button>
        <div class="iq-val">${item.qty}</div>
        <button class="iq-btn" onclick="adjustItem(${idx}, 1)">+</button>
      </div>
      <button class="del-btn" onclick="deleteItem(${idx})">✕</button>
    </div>
  `).join('');
}

function adjustItem(idx, delta) {
  items[idx].qty = Math.max(1, items[idx].qty + delta);
  saveItems();
  renderList();
}

function deleteItem(idx) {
  items.splice(idx, 1);
  saveItems();
  renderList();
}

function renderExport() {
  document.getElementById('expPositions').textContent = items.length;
  document.getElementById('expTotal').textContent = items.reduce((s, i) => s + i.qty, 0);
  document.getElementById('expDate').textContent = new Date().toLocaleDateString('uk-UA');
  generateCSV();
}

function generateCSV() {
  if (items.length === 0) {
    document.getElementById('csvPreview').textContent = 'Список порожній';
    document.getElementById('exportArea').value = '';
    return;
  }
  const header = 'EAN;Назва;Одиниця;Кількість';
  const rows = items.map(i => `${i.ean};${i.title};${i.unit || 'шт'};${i.qty}`);
  const csv = [header, ...rows].join('\n');
  document.getElementById('exportArea').value = csv;

  const preview = rows.slice(0, 8).join('\n') + (rows.length > 8 ? `\n... ще ${rows.length - 8} рядків` : '');
  document.getElementById('csvPreview').textContent = header + '\n' + preview;
}

function copyCSV() {
  const area = document.getElementById('exportArea');
  if (!area.value) return toast('Список порожній', true);
  area.select();
  try {
    navigator.clipboard.writeText(area.value).then(() => toast('Скопійовано!')).catch(() => {
      document.execCommand('copy');
      toast('Скопійовано!');
    });
  } catch(e) {
    document.execCommand('copy');
    toast('Скопійовано!');
  }
}

function clearAll() {
  if (items.length === 0) return;
  if (confirm('Очистити весь список?')) {
    items = [];
    saveItems();
    renderList();
    toast('Список очищено');
  }
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

// Init
updateHeader();
</script>
</body>
</html>
