<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScanCount — Цінники</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;700&display=swap');

:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --border: #2a2a2a;
  --accent: #f5c518;
  --text: #f0f0f0;
  --muted: #666;
  --success: #4caf50;
  --error: #f44336;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 20px;
  cursor: pointer;
  padding: 0 4px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--accent);
}

.badge {
  background: var(--accent);
  color: #000;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}

.content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}

.panel-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-title::before {
  content: '';
  width: 3px;
  height: 12px;
  background: var(--accent);
  border-radius: 2px;
}

.input-row {
  display: flex;
  gap: 8px;
}

input[type=text], input[type=number] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  padding: 10px 13px;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

input:focus { border-color: var(--accent); }

.btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}

.btn:active { opacity: 0.7; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--error); color: #fff; }

/* Items list */
.item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.item-row:last-child { border-bottom: none; }

.item-info { flex: 1; min-width: 0; }

.item-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-ean {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.price-input {
  width: 90px;
  font-size: 14px;
  padding: 7px 10px;
  text-align: center;
}

.del-btn {
  background: none;
  border: none;
  color: var(--error);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
}

.empty {
  padding: 30px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.btn-row {
  display: flex;
  gap: 8px;
}

.btn-row .btn { flex: 1; }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--success);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  padding: 10px 20px;
  border-radius: 24px;
  z-index: 999;
  transition: transform 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--error); }

/* ===== ДРУК ===== */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body, .content, header, .panel, .btn-row, .toast { display: none !important; }

  #printArea { display: block !important; }

  @page {
    size: A4;
    margin: 5mm;
  }
}

#printArea {
  display: none;
}

/* Аркуш A4 з цінниками 58×40мм */
.print-page {
  width: 200mm;
  display: flex;
  flex-wrap: wrap;
  gap: 3mm;
  padding: 2mm;
}

/* Один цінник 58×40мм */
.price-tag {
  width: 58mm;
  height: 40mm;
  border: 0.5pt solid #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2mm 3mm;
  font-family: Arial, sans-serif;
  page-break-inside: avoid;
  overflow: hidden;
  position: relative;
}

.tag-name {
  font-size: 9pt;
  font-weight: bold;
  line-height: 1.2;
  max-height: 22mm;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.tag-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-top: 0.5pt solid #ccc;
  padding-top: 1mm;
  margin-top: 1mm;
}

.tag-price {
  font-size: 18pt;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1pt;
}

.tag-price-label {
  font-size: 7pt;
  color: #555;
  text-align: right;
  line-height: 1.3;
}

/* Превʼю цінника */
.tag-preview {
  width: 116px;
  height: 80px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 4px 6px;
  font-family: Arial, sans-serif;
  flex-shrink: 0;
}

.preview-name {
  font-size: 8px;
  font-weight: bold;
  line-height: 1.2;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  color: #000;
}

.preview-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-top: 1px solid #ddd;
  padding-top: 2px;
}

.preview-price {
  font-size: 16px;
  font-weight: 900;
  color: #000;
  line-height: 1;
}

.preview-unit {
  font-size: 7px;
  color: #555;
  text-align: right;
  line-height: 1.3;
}
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <div class="logo">Цінники</div>
  <span class="badge">58×40мм</span>
</header>

<div class="content">

  <!-- Сканування -->
  <div class="panel">
    <div class="panel-title">Сканувати або ввести штрих-код</div>
    <div class="input-row">
      <input type="text" id="barcodeInput" inputmode="numeric"
        placeholder="Штрих-код..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter') addItem()">
      <button class="btn" onclick="addItem()">+</button>
    </div>
  </div>

  <!-- Список товарів -->
  <div class="panel">
    <div class="panel-title">Товари <span id="countBadge" style="color:var(--accent)">0</span></div>
    <div id="itemsList">
      <div class="empty">Скануйте товари щоб додати до списку цінників</div>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="clearAll()">✕ Очистити</button>
    <button class="btn btn-success" onclick="printTags()" id="printBtn" disabled>🖨 Друкувати цінники</button>
  </div>

  <div style="font-size:11px;color:var(--muted);text-align:center">
    На аркуші A4 поміщається до 24 цінників (6×4)
  </div>

</div>

<!-- Зона друку (прихована на екрані) -->
<div id="printArea">
  <div class="print-page" id="printPage"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = 'https://scancount-barcode.scancount-service.workers.dev';
let items = [];

async function addItem() {
  const input = document.getElementById('barcodeInput');
  const ean = input.value.trim().replace(/\D/g, '');
  if (!ean) return;

  // Перевіряємо чи вже є
  if (items.find(i => i.ean === ean)) {
    toast('Вже є в списку', true);
    input.value = '';
    input.focus();
    return;
  }

  try {
    const res = await fetch(`${WORKER_URL}/${ean}`);
    const data = await res.json();

    const item = {
      ean,
      title: data.found ? data.title : 'Невідомий товар',
      unit: data.found ? (data.unit || 'шт') : 'шт',
      price: ''
    };

    items.push(item);
    renderList();
    toast(data.found ? `Додано: ${item.title.slice(0,25)}` : `EAN ${ean} — введіть назву`);
  } catch(e) {
    // Якщо worker недоступний — додаємо вручну
    items.push({ ean, title: 'Товар ' + ean, unit: 'шт', price: '' });
    renderList();
    toast('Додано (без назви)', true);
  }

  input.value = '';
  input.focus();
}

function renderList() {
  const container = document.getElementById('itemsList');
  document.getElementById('countBadge').textContent = items.length;
  document.getElementById('printBtn').disabled = items.length === 0;

  if (items.length === 0) {
    container.innerHTML = '<div class="empty">Скануйте товари щоб додати до списку цінників</div>';
    return;
  }

  container.innerHTML = items.map((item, idx) => `
    <div class="item-row">
      <div class="tag-preview">
        <div class="preview-name">${item.title}</div>
        <div class="preview-bottom">
          <div class="preview-price">${item.price || '—'}</div>
          <div class="preview-unit">грн/${item.unit}</div>
        </div>
      </div>
      <div class="item-info">
        <div class="item-name">${item.title}</div>
        <div class="item-ean">${item.ean} · ${item.unit}</div>
        <input type="number"
          class="price-input"
          style="margin-top:6px;width:100%"
          placeholder="Ціна грн"
          value="${item.price}"
          min="0"
          step="0.5"
          oninput="setPrice(${idx}, this.value)"
          onkeydown="if(event.key==='Enter'){let next=document.querySelectorAll('.price-input')[${idx}+1]; if(next) next.focus();}">
      </div>
      <button class="del-btn" onclick="removeItem(${idx})">✕</button>
    </div>
  `).join('');
}

function setPrice(idx, val) {
  items[idx].price = val;
  // Оновлюємо превʼю
  const previews = document.querySelectorAll('.preview-price');
  if (previews[idx]) previews[idx].textContent = val || '—';
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderList();
}

function clearAll() {
  if (!items.length) return;
  items = [];
  renderList();
  toast('Очищено');
}

function printTags() {
  const noPrice = items.filter(i => !i.price);
  if (noPrice.length > 0) {
    if (!confirm(`${noPrice.length} товарів без ціни. Друкувати все одно?`)) return;
  }

  // Генеруємо цінники
  const printPage = document.getElementById('printPage');
  printPage.innerHTML = items.map(item => `
    <div class="price-tag">
      <div class="tag-name">${item.title}</div>
      <div class="tag-bottom">
        <div class="tag-price">${item.price || '—'} <span style="font-size:10pt">грн</span></div>
        <div class="tag-price-label">за 1 ${item.unit}<br><span style="font-size:6pt;color:#999">${item.ean}</span></div>
      </div>
    </div>
  `).join('');

  window.print();
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
